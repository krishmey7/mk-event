<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#2A1824" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F0E8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A1824" />
    <meta name="application-name" content="MK Events" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MK Events" />
    <meta
      name="description"
      content="MK Events — invitations numériques vivantes. Créez, personnalisez et publiez : RSVP, pass QR et check-in pour mariages, anniversaires et événements professionnels."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MK Events — Invitations numériques vivantes" />
    <meta
      property="og:description"
      content="Studio d’invitations, RSVP et check-in QR. Des modèles signature pour faire vivre votre événement."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MK Events — Invitations numériques vivantes" />
    <meta
      name="twitter:description"
      content="Créez, personnalisez et publiez vos invitations. RSVP et pass QR inclus."
    />
    <title>%WEB_TITLE%</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Landing : même famille qu’Edulex (ID Grotesk). -->
    <link href="https://fonts.cdnfonts.com/css/id-grotesk" rel="stylesheet" />

    <style id="expo-reset">
      /* Edge-to-edge : peindre sous status bar + home indicator / nav Android. */
      :root {
        --mk-app-height: 100dvh;
        --mk-bg: #2a1824;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        min-height: 100svh;
        background-color: var(--mk-bg);
        color-scheme: light dark;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        /* iOS standalone : 100vh inclut la safe area (WebKit #254868). */
        min-height: 100vh;
      }
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--mk-app-height, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: var(--mk-bg);
      }
      /* RN Web : SafeAreaProvider / Navigation créent des wrappers sans hauteur. */
      #root > div,
      #root > div > div {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      @media all and (display-mode: standalone),
        all and (display-mode: fullscreen),
        all and (display-mode: minimal-ui) {
        html,
        body {
          height: 100vh;
          min-height: 100vh;
        }
        #root {
          height: 100vh;
          max-height: none;
        }
      }
    </style>

    <script>
      (function () {
        function syncAppHeight() {
          var h =
            (window.visualViewport && window.visualViewport.height) ||
            window.innerHeight ||
            document.documentElement.clientHeight;
          if (!h) return;
          document.documentElement.style.setProperty('--mk-app-height', h + 'px');
        }
        syncAppHeight();
        window.addEventListener('resize', syncAppHeight, { passive: true });
        window.addEventListener('orientationchange', syncAppHeight, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncAppHeight, { passive: true });
          window.visualViewport.addEventListener('scroll', syncAppHeight, { passive: true });
        }
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              function check() {
                try {
                  reg.update();
                } catch (e) {}
              }
              check();
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') check();
              });
              setInterval(check, 5 * 60 * 1000);
            })
            .catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Activez JavaScript pour utiliser MK Events.</noscript>
    <div id="root"></div>
  </body>
</html>
